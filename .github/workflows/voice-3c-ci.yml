name: Voice 3C PowerShell and Databricks contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts without running them
        shell: pwsh
        run: |
          foreach ($path in (Get-ChildItem -Path scripts -Filter *.ps1).FullName) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $path"
          }
      - name: Validate Gemini WAV recording without microphone hardware
        shell: pwsh
        run: |
          python tests/test_microphone_capture.py
      - name: Check voice provider selection is explicit
        shell: pwsh
        run: |
          $client = Get-Content scripts/Activar-Microfono3C.ps1 -Raw
          foreach ($needle in @('$Motor', '"Gemini"', '"Wispr"', '"Windows"', 'Grabar-Microfono3C.py', 'Enviar-Voz3C.ps1', 'ESP32_API_TOKEN')) {
            if (-not $client.Contains($needle)) { throw "Missing voice provider contract: $needle" }
          }
          if ($client.Contains('/apply')) { throw 'Voice engine must not apply Sheets' }
          $agent = Get-Content scripts/Escuchar-BotonESP32.ps1 -Raw
          foreach ($needle in @('/voice/capture/next', 'Grabar-Microfono3C.py', '/voice/transcribe', '/voice/drafts', 'delivered_to_editor')) {
            if (-not $agent.Contains($needle)) { throw "Missing panel dictation agent contract: $needle" }
          }
          if (-not $agent.Contains('$targetDeviceId')) { throw 'Missing automatic physical panel routing' }
          if ($agent.Contains('/api/review/proposals/') -or $agent.Contains('/api/device/v1/commands')) {
            throw 'Touch microphone agent must never auto-submit or apply a command'
          }
      - name: Check read-only diagnostic and safety
        shell: pwsh
        run: |
          $diag = Get-Content scripts/Probar-Extremo3C.ps1 -Raw
          $client = Get-Content scripts/Enviar-Voz3C.ps1 -Raw
          if (-not $diag.Contains('/api/device/v1/cloud/verify')) { throw 'Missing Sheets verification' }
          if ($diag.Contains('batchUpdate') -or $diag.Contains('/apply')) { throw 'Diagnostic must be read-only' }
          if (-not $client.Contains('/api/device/v1/voice/drafts')) { throw 'Missing voice draft endpoint' }
          if ($client.Contains('/api/review/proposals/') -and $client.Contains('/apply')) { throw 'Voice must not apply Sheets' }

  backend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wpv10barza/asistente-de-databricks--erp
          ref: ade0bcd9c2f33018d339a3be3041be4bb41e8e47
          path: cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify cloud voice implementation and auth
        run: |
          python -m pip install -r cloud/requirements.txt
          cd cloud
          python -m pytest -q tests/test_voice_3c.py
          grep -q 'voice_provider_probe' app/main.py
          grep -q 'request_windows_voice_capture' app/main.py
          grep -q 'next_windows_voice_capture' app/main.py
          grep -q 'claim_unique_capture' app/voice_3c.py
          grep -q 'voice_available_models' app/main.py
          grep -q 'gemini-3.8-flash' app.yaml
          grep -q 'VoiceProviderError' app/voice_3c.py
